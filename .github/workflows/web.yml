name: web app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Data contract (Python)
        run: python scripts/check_data.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
        env:
          # Public URL of the SI assistant on Cloud Run (repo variable; docs/11-assistant.md).
          # Empty = the assistant button is not shown.
          VITE_ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
      - run: npx playwright install --with-deps chromium && npm run smoke
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: frontend/dist }

  deploy:
    # Needs Settings → Pages → Source: "GitHub Actions" (one-time, by a repo admin)
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
