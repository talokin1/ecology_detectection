# Job list for scripts/build_data.py: which cached series the statistics team needs.
# Run `python scripts/build_data.py --dry-run` to see the expanded list without fetching.
version: 0.1

# Region preset ids from data/catalog/regions.yaml (the plan-v2 case regions).
# Both sections below use this list unless a section gives its own `regions:`.
regions: [south_ukraine, ukraine, north_europe, south_europe]

# Every *available* catalog variable (a reader exists) x every region above.
# Variables that need an Earthdata login (GRACE, MODIS NDVI) are served from the cache;
# they are fetched only with --with-earthdata.
matrix:
  variables: all          # "all" = acquire.list_variables(available_only=True), or a list of ids
  exclude_variables: []   # catalog ids to leave out of the matrix (reported as "skipped")

# Further matrices with their own regions. "set:ar6" = every buildable IPCC AR6 land reference region
# (data/catalog/regions_ar6.yaml; 43 of 46, the ice-sheet regions are not built). Only readers that
# clip to an outline (POWER, GRACE) are used; sea ice is an ocean variable and AR6 means are land-only.
# Daily method inputs are not built for AR6 regions (about 0.1-1 GB of daily reads per region).
extra_matrices:
  - regions: ["set:ar6"]
    variables: all
    exclude_variables: [sea_ice_fraction_power, ndvi_modis, no2_tropospheric_omi]

# Method inputs that are not catalog variables (daily data for extreme indices, plan v2 S2).
# `how` is only used to aggregate the daily series to months for the data-quality check
# ("mean" for states such as temperature, "sum" for per-day fluxes such as precipitation).
inputs:
  - {parameter: T2M_MAX, store: merra2_daily, how: mean}
  - {parameter: T2M_MIN, store: merra2_daily, how: mean}
  - {parameter: PRECTOTCORR, store: merra2_daily, how: sum}
